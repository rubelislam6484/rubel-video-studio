<script>

let S={clips:[],ratio:[9,16],name:'প্রজেক্ট'},M={},E={},sel=null,t=0,playing=false,PX=60,Q=540,W=540,H=960,hist=[],hi=-1,tab='media',cfg=JSON.parse(localStorage.rvs||'{}'),EXP=0,AS,FR=[],KS=[];

/* history */
function commit(){hist=hist.slice(0,hi+1);hist.push(JSON.stringify(S.clips));hi++;clearTimeout(AS);AS=setTimeout(()=>saveP(),1500);renderTL()}
function undo(){if(hi>0){hi--;S.clips=JSON.parse(hist[hi]);sel=null;render()}}function redo(){if(hi<hist.length-1){hi++;S.clips=JSON.parse(hist[hi]);sel=null;render()}}
/* render */
function resize(){const[a,b]=S.ratio,e=n=>Math.round(n/2)*2;if(a<b){W=e(Q);H=e(Q*b/a)}else if(a>b){H=e(Q);W=e(Q*a/b)}else W=H=e(Q);cv.width=W;cv.height=H}
const fstr=c=>`brightness(${c.b}%) contrast(${c.c}%) saturate(${c.s}%) hue-rotate(${c.h}deg) blur(${c.bl}px) sepia(${c.sp}%) grayscale(${c.g}%)`;
function draw(t){x.fillStyle='#000';x.fillRect(0,0,W,H);const act=S.clips.filter(c=>t>=c.start&&t<end(c));
 act.filter(c=>c.kind=='v'||c.kind=='i').sort((a,b)=>a.track-b.track).forEach(c=>{const e=el(c),lt=t-c.start,d=dur(c);let a=1;if(c.fi)a=Math.min(a,lt/c.fi);if(c.fo)a=Math.min(a,(d-lt)/c.fo);
  const w0=e.videoWidth||e.naturalWidth,h0=e.videoHeight||e.naturalHeight;if(!w0)return;const sc=Math.min(W/w0,H/h0)*c.scale;

 x.filter='none';
 act.filter(c=>c.kind=='t').forEach(c=>{const lt=t-c.start,fs=c.size*W/100;let a=1,dy=0,sc=1;const p=Math.min(1,lt/.4);
  if(c.an=='fade')a=p;if(c.an=='pop')sc=.6+.4*p;if(c.an=='slide'){a=p;dy=(1-p)*fs*2}
  x.save();x.globalAlpha=a;x.translate(W/2,H*c.py/100+dy);x.scale(sc,sc);x.font=`800 ${fs}px "Noto Sans Bengali",system-ui,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.lineWidth=fs/6;x.lineJoin='round';x.strokeStyle='#000';x.fillStyle=c.color;
  c.text.split('\n').forEach((l,i,ar)=>{const y=(i-(ar.length-1)/2)*fs*1.25;x.strokeText(l,0,y);x.fillText(l,0,y)});x.restore()});
 if(EXP&&$('#xw')&&$('#xw').checked){x.font=`700 ${W/30}px system-ui`;x.fillStyle='#fff9';x.textAlign='right';x.fillText('RUBEL VIDEO STUDIO',W-12,H-14)}}
function sync(){S.clips.forEach(c=>{if(c.kind=='i'||c.kind=='t')return;const e=el(c),on=t>=c.start&&t<end(c);
 if(on&&playing){const want=c.in+(t-c.start)*c.speed;if(e.paused){e.currentTime=want;e.play().catch(()=>{})}else if(Math.abs(e.currentTime-want)>.35)e.currentTime=want;if(e.playbackRate!=c.speed)e.playbackRate=c.speed;
  if(e._g){const lt=t-c.start,d=dur(c);let a=1;if(c.fi)a=Math.min(a,lt/c.fi);if(c.fo)a=Math.min(a,(d-lt)/c.fo);e._g.gain.value=c.vol*Math.max(0,a)}}else if(!e.paused)e.pause()})}
function setT(v){t=Math.max(0,v);S.clips.forEach(c=>{if((c.kind=='v'||c.kind=='a')&&t>=c.start&&t<end(c))try{el(c).currentTime=c.in+(t-c.start)*c.speed}catch{}})}

 if(!$('#ed').classList.contains('hid')){draw(t);$('#tm').textContent=fmt(t)+' / '+fmt(total());const p=$('#ph');if(p){p.style.left=t*PX+'px';if(playing){const l=$('#tl');if(t*PX>l.scrollLeft+l.clientWidth-40)l.scrollLeft=t*PX-40}}}

 $$('.blk').forEach(b=>b.onpointerdown=e=>{const c=S.clips.find(k=>k.id==b.dataset.id),sx=e.clientX,s0=c.start;let mv=0;if(sel!=c.id){sel=c.id;panel()}
